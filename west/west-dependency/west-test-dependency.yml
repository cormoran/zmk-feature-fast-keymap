# List of this module's dependencies for testing
manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: cormoran
      url-base: https://github.com/cormoran
  projects:
    - name: zmk
      remote: cormoran
      # TEST-ONLY revision. Consumers use plain main+custom-studio-protocol by
      # default (see README). The tests enable CONFIG_ZMK_FAST_KEYMAP_DEFAULT_LAYER,
      # which needs the non-upstream zmk_stock_keymap_get_layer_binding_at_idx()
      # accessor; the get_pending RPC additionally needs
      # zmk_keymap_layer_binding_at_idx_is_pending() (cormoran/zmk PR #30). This
      # branch is expose-stock-keymap + that accessor cherry-picked on top.
      # TODO: re-pin to expose-stock-keymap (or main+custom-studio-protocol) once
      # PR #30 merges and the stock-keymap branch rebases onto it.
      revision: claude/expose-stock-keymap+unsaved
      import:
        file: app/west.yml
      clone-depth: 1
    - name: zmk-west-commands
      remote: cormoran
      revision: main
      import: true
    # Provides the Renode-only Studio RPC UART transport + the
    # renode-studio-uart snippet (as a Zephyr module -- see its own
    # zephyr/module.yml) used by tests/zmk-config/build.yaml's
    # renode_smoke_test artifact and the zmk-renode-test GitHub Action.
    # Test-only: do not add this to west-dependency.yml (that one is
    # imported by consumers of this module).
    # TODO: switch revision to main once cormoran/zmk-workspace's
    # claude/renode-ci-action PR merges.
    - name: zmk-workspace
      remote: cormoran
      revision: e4d20098a5be99fffa355047419f8a678031abb8
      clone-depth: 1
