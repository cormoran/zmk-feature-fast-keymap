# List of this module's dependencies for testing
manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: cormoran
      url-base: https://github.com/cormoran
  projects:
    - name: zmk
      remote: cormoran
      # TEST-ONLY revision. The tests enable CONFIG_ZMK_FAST_KEYMAP_DEFAULT_LAYER
      # (needs the non-upstream zmk_stock_keymap_get_layer_binding_at_idx()
      # accessor) and exercise the get_pending RPC (needs
      # zmk_keymap_layer_binding_at_idx_is_pending()). This branch carries both
      # on top of main+custom-studio-protocol and is the minimum branch a
      # consumer of this module needs (see README).
      revision: main+custom-studio-protocol+fast-keymap
      import:
        file: app/west.yml
      clone-depth: 1
    - name: zmk-west-commands
      remote: cormoran
      revision: main
      import: true
    # Provides the Renode-only Studio RPC UART transport + the
    # renode-studio-uart snippet (as a Zephyr module -- see its own
    # zephyr/module.yml) used by tests/zmk-config/build.yaml's
    # renode_smoke_test artifact and the zmk-renode-test GitHub Action.
    # Test-only: do not add this to west-dependency.yml (that one is
    # imported by consumers of this module).
    # TODO: switch revision to main once cormoran/zmk-workspace's
    # claude/renode-ci-action PR merges.
    - name: zmk-workspace
      remote: cormoran
      revision: e4d20098a5be99fffa355047419f8a678031abb8
      clone-depth: 1
